<head>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
  <style>
    :root{--accent:#6C63FF;--bg:#0d0d14;--bg2:#13131f;--border:rgba(255,255,255,0.08);--text:#f0f0f8;--text2:rgba(240,240,248,0.55);--font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;}
    [data-theme="light"]{--bg:#f5f5fb;--bg2:#eeeef8;--border:rgba(0,0,0,0.09);--text:#0d0d14;--text2:rgba(13,13,20,0.58);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
    .cert-page{max-width:900px;width:100%;text-align:center;}
    .cert-back{display:inline-flex;align-items:center;gap:.5rem;color:var(--accent);font-family:var(--font-display);font-weight:600;font-size:.9rem;text-decoration:none;margin-bottom:2rem;letter-spacing:.05em;transition:opacity .2s;}
    .cert-back:hover{opacity:.7;}
    .cert-back svg{width:16px;height:16px;}
    .cert-label{font-family:var(--font-display);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:.75rem;}
    .cert-title{font-family:var(--font-display);font-size:2rem;font-weight:800;margin-bottom:.5rem;}
    .cert-sub{color:var(--text2);font-size:.95rem;margin-bottom:2rem;}
    .cert-img-wrap{border-radius:16px;overflow:hidden;border:1px solid var(--border);box-shadow:0 20px 60px rgba(108,99,255,.15);background:var(--bg2);}
    .cert-img-wrap img{width:100%;height:auto;display:block;}
    .cert-meta{margin-top:1.5rem;display:flex;justify-content:center;gap:2rem;flex-wrap:wrap;}
    .cert-meta-item{font-size:.85rem;color:var(--text2);}
    .cert-meta-item strong{color:var(--text);display:block;margin-bottom:.2rem;}
  </style>
</head>
